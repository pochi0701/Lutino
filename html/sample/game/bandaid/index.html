<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>BANDAID</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Courier New', Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    font-size: 2.8rem;
    letter-spacing: 0.4em;
    color: #f0c040;
    text-shadow: 0 0 16px rgba(240,192,64,0.6);
    margin-bottom: 0.3rem;
  }
  #stage-label {
    font-size: 1rem;
    letter-spacing: 0.25em;
    color: #aaa;
    margin-bottom: 1.2rem;
  }
  canvas {
    display: block;
    border: 2px solid #444;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
  }
  .home-btn {
    margin-top: 1.4rem;
    display: inline-block;
    padding: 0.45rem 2rem;
    background: #2a2a3e;
    color: #bbb;
    text-decoration: none;
    border-radius: 4px;
    letter-spacing: 0.12em;
    border: 1px solid #555;
    font-family: inherit;
    font-size: 0.9rem;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .home-btn:hover {
    background: #3a3a5e;
    color: #fff;
    border-color: #888;
  }
</style>
</head>
<body>
  <h1>BANDAID</h1>
  <div id="stage-label">STAGE -</div>
  <canvas id="mainWindow" width="420" height="290"></canvas>
  <a class="home-btn" href="/">&#x2302; Home</a>
  <script type="text/javascript" src="soko.js"></script>
</body>
</html>
